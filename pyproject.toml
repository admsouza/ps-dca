[project]
name = "ps-dca"
version = "0.1.0"
description = "Processamento da DCA (Declaração de Contas Anuais — SICONFI/STN)"
requires-python = ">=3.11"

# Runtime da fase atual: base canônica de regras (ipc07-bo-regras-canonicas).
# FastAPI/arq/SQLAlchemy entram nas fases F2 e F3 (change plataforma-pipeline-dca).
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.25",
    "requests>=2.32",   # adapters MSC (SICONFI e PublicSoft); fora do núcleo de domínio
]

[project.optional-dependencies]
# F2 (transporte) e F3 (pipeline) — change plataforma-pipeline-dca, task 1.2.
# Extra enquanto nada em `app/` as importa; migram para `dependencies` quando a F2 entrar.
# Nenhuma delas é alcançável a partir de `app/domain/` — garantido por
# tests/test_fronteira_camadas.py.
plataforma = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "gunicorn>=23.0",
    "pydantic>=2.9",
    "arq>=0.26",
    "redis>=5.2",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg2-binary>=2.9",
    "python-jose[cryptography]>=3.3",
    "cryptography>=43.0",
]

dev = [
    "pytest>=8.0",
    "ruff>=0.16",
    "pymupdf>=1.24",  # extração geométrica do PDF; uso manual, fora do CI
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
